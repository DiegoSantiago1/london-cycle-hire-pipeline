# Job diário: recria o banco do zero a partir do bruto (prova de que o pipeline é
# reprodutível), roda o dbt com os testes, exporta o painel e publica a página.
# Se um teste do dbt falha, a página não é atualizada (fica a de ontem).
name: diario

on:
  schedule:
    # 05:41 UTC: depois do pacote diário (03:17) e antes do pico da manhã em Londres.
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "dbt/**"
      - "dados/agregados/**"
      - "src/bicicletas/**"
      - "db/**"
      - ".github/workflows/diario.yml"

permissions:
  contents: write # commit de manutenção (ver o último passo)
  pages: write
  id-token: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BICICLETAS_DB_HOST: 127.0.0.1
      BICICLETAS_DB_PORT: "5432"
      BICICLETAS_DB_NAME: bicicletas
      BICICLETAS_DB_NAME_TESTE: bicicletas_teste
      BICICLETAS_DB_USER: bicicletas
      BICICLETAS_DB_PASSWORD: senha_so_do_job_diario
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      frescor: ${{ steps.frescor.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar usuário, bancos e schemas
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -d postgres \
            -v usuario="$BICICLETAS_DB_USER" -v senha="$BICICLETAS_DB_PASSWORD" \
            -v banco="$BICICLETAS_DB_NAME" -v banco_teste="$BICICLETAS_DB_NAME_TESTE" \
            -f db/bootstrap.sql
          python -m bicicletas.migracoes principal

      - name: Baixar e carregar os últimos 28 dias de retratos
        run: |
          bash scripts/baixar_retratos.sh 28 retratos
          python -m bicicletas.retratos_carga --pasta retratos

      - name: Carregar os agregados das viagens
        run: python -m bicicletas.agregados carregar

      - name: dbt build (modelos e testes)
        run: python -m bicicletas.dbt_rodar build --select tag:diario

      # Freshness falhando (coleta parada) não impede a publicação: a página mostra a
      # saúde em vermelho. O job termina vermelho no fim (job "conferir").
      - name: dbt source freshness
        id: frescor
        continue-on-error: true
        run: python -m bicicletas.dbt_rodar source freshness --select source:bruto.retratos

      - name: Exportar o painel
        run: python -m bicicletas.exportar_site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Em repositório público, o GitHub desliga workflows agendados depois de 60 dias
      # sem atividade. Se o último commit tem mais de 45 dias, um commit vazio de
      # manutenção mantém a coleta ligada.
      - name: Manutenção (mantém os agendamentos ativos)
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: manutenção (mantém os agendamentos ativos)"
            git push
          fi

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  conferir:
    needs: [construir, publicar]
    runs-on: ubuntu-latest
    steps:
      - name: Freshness da coleta
        if: needs.construir.outputs.frescor != 'success'
        run: |
          echo "::error::A coleta ao vivo está atrasada (dbt source freshness falhou)."
          exit 1
      - run: echo "Tudo em dia."
