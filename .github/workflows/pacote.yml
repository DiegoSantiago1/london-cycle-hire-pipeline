# Pacote diário: copia o dia (UTC) do S3 para a release pública (o espelho fora da AWS) e
# junta os retratos num .tar conferido por hash, anexado na mesma release. O job diário
# baixa 28 pacotes em vez de ~2.700 arquivos.
name: pacote-diario

on:
  schedule:
    # 03:17 UTC: o dia anterior já terminou há mais de 3 h, inclusive coletas atrasadas.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia a empacotar (AAAA-MM-DD, UTC). Vazio = ontem."
        required: false

permissions:
  contents: write
  id-token: write # token OIDC para entrar na AWS sem chave guardada (D48)

concurrency:
  group: pacote
  cancel-in-progress: false

jobs:
  empacotar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Dia a empacotar
        id: dia
        env:
          # Entrada do usuário vai por variável de ambiente, nunca direto no script
          # (evita injeção de comando pelo campo do formulário).
          DIA_INFORMADO: ${{ inputs.dia }}
        run: echo "dia=${DIA_INFORMADO:-$(date -u -d yesterday +%F)}" >> "$GITHUB_OUTPUT"

      # A Lambda grava no S3 (D45). Sem as variáveis do repositório (um fork, por exemplo),
      # o pacote usa só o que já está na release, como antes.
      - name: Entrar na AWS (OIDC, sem chave guardada)
        if: vars.AWS_ROLE_ARN != ''
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash scripts/aws_oidc.sh

      - name: Espelhar o dia do S3 na release
        if: vars.AWS_ROLE_ARN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRUTO_BUCKET: ${{ vars.BRUTO_BUCKET }}
          DIA: ${{ steps.dia.outputs.dia }}
          PULAR_EXISTENTES: "1"
        run: |
          bash scripts/espelhar_s3.sh "$DIA" espelho
          bash scripts/publicar_release.sh espelho

      - name: Montar e publicar o pacote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIA: ${{ steps.dia.outputs.dia }}
          PYTHONPATH: src
        run: bash scripts/empacotar_dia.sh "$DIA"
