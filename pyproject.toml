[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bicicletas"
version = "0.1.0"
description = "Pipeline de dados das bicicletas públicas de Londres (TfL Santander Cycles)"
requires-python = ">=3.14"
# As dependências ficam fixadas em requirements.txt / requirements-dev.txt,
# para o ambiente ser reproduzível. Este arquivo só torna o pacote instalável
# (pip install -e .) e concentra a configuração das ferramentas.

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", # estilo (pycodestyle)
    "F",      # erros prováveis (pyflakes)
    "I",      # ordem dos imports
    "B",      # bugs comuns (bugbear)
    "UP",     # sintaxe moderna do Python
    "SIM",    # simplificações
    "S",      # segurança (bandit)
    "RUF",    # regras do próprio ruff
]

[tool.ruff.lint.per-file-ignores]
# assert é o jeito normal de testar no pytest; senhas de teste são fictícias.
"tests/**" = ["S101", "S105", "S106"]
# Migrations: SQL longo dentro de strings, montado só com texto constante do próprio arquivo.
"db/migracoes/versions/**" = ["E501", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["bicicletas"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "db/migracoes"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not rede'"
# Aviso vira erro: foi assim que apareceu o HTTPError não fechado na coleta.
filterwarnings = ["error"]
markers = [
    "integracao: precisa do Docker e do banco bicicletas rodando",
    "rede: acessa a internet de verdade (API da TfL); rode com -m rede",
]
